<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" aria-label="Sticker Dr. Cuack: en-mi-maquina" viewBox="0 0 512 512"><defs><linearGradient id="gBeak" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffbe55"/><stop offset="100%" stop-color="#ee8e1e"/></linearGradient><linearGradient id="gFoot" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f5ac42"/><stop offset="100%" stop-color="#de8b26"/></linearGradient><linearGradient id="gCoat" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e8eef5"/></linearGradient><radialGradient id="gBody" cx="226" cy="316" r="170" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe07a"/><stop offset="55%" stop-color="#ffcf3f"/><stop offset="100%" stop-color="#f0ae2b"/></radialGradient><radialGradient id="gHead" cx="230" cy="120" r="210" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe38a"/><stop offset="55%" stop-color="#ffd147"/><stop offset="100%" stop-color="#f2b02c"/></radialGradient><clipPath id="clipEyeL"><ellipse cx="210" cy="150" rx="27" ry="32"/></clipPath><clipPath id="clipEyeR"><ellipse cx="302" cy="150" rx="27" ry="32"/></clipPath><filter id="diecut" width="124%" height="124%" x="-12%" y="-12%"><feMorphology in="SourceAlpha" operator="dilate" radius="11" result="grow"/><feFlood flood-color="#fff"/><feComposite in2="grow" operator="in" result="border"/><feMerge><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="stickershadow" width="132%" height="132%" x="-16%" y="-16%"><feDropShadow dx="0" dy="7" flood-color="#1b2430" flood-opacity=".35" stdDeviation="9"/></filter></defs><style>#duck { animation: bob 4.2s ease-in-out infinite; }
    #shadow { transform-box: view-box; transform-origin: 256px 480px;
              animation: shadowPulse 4.2s ease-in-out infinite; }
    #head { transform-box: view-box; transform-origin: 256px 288px;
            animation: tilt 6.4s ease-in-out infinite; }
    #hair path { transform-box: view-box; transform-origin: 254px 62px;
                 animation: sway 3.4s ease-in-out infinite; }
    #hair path:nth-child(2) { animation-delay: .35s; }
    #hair path:nth-child(3) { animation-delay: .7s; }
    .lid { transform-box: fill-box; transform-origin: 50% 0%;
           transform: scaleY(0); animation: blink 5.6s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes shadowPulse { 0%,100% { transform: scale(1); opacity:.12 } 50% { transform: scale(1.06); opacity:.16 } }
    @keyframes tilt { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-1.3deg); } 75% { transform: rotate(1.1deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 90.5%, 94.5%, 100% { transform: scaleY(0); } 91.5%, 93.5% { transform: scaleY(1); } }
    /* clases opcionales: añadir en el elemento raíz del SVG */
    svg.talk #bill-lower, .talk #bill-lower { animation: talk .42s ease-in-out infinite; }
    #bill-lower { transform-box: view-box; transform-origin: 256px 248px; }
    @keyframes talk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .wave #arm-up { animation: wave 1.1s ease-in-out infinite; }
    #arm-up { transform-box: view-box; transform-origin: 330px 320px; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .meme { font-family: &apos;Archivo Black&apos;,&apos;Arial Black&apos;,&apos;DejaVu Sans&apos;,sans-serif;
      font-weight: 900; fill: #FFFFFF; stroke: #1B2430; stroke-width: 9px;
      paint-order: stroke; stroke-linejoin: round; letter-spacing: .5px;
