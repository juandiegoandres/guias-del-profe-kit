<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" aria-labelledby="t d" viewBox="0 0 512 512"><title id="t">Dr. Cuack — médico</title><desc id="d">Dr. Cuack con bata médica, estetoscopio y carné.</desc><defs><linearGradient id="gBeak" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffbe55"/><stop offset="100%" stop-color="#ee8e1e"/></linearGradient><linearGradient id="gFoot" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f5ac42"/><stop offset="100%" stop-color="#de8b26"/></linearGradient><linearGradient id="gCoat" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e8eef5"/></linearGradient><radialGradient id="gBody" cx="226" cy="316" r="170" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe07a"/><stop offset="55%" stop-color="#ffcf3f"/><stop offset="100%" stop-color="#f0ae2b"/></radialGradient><radialGradient id="gHead" cx="230" cy="120" r="210" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe38a"/><stop offset="55%" stop-color="#ffd147"/><stop offset="100%" stop-color="#f2b02c"/></radialGradient><clipPath id="clipEyeL"><ellipse cx="210" cy="150" rx="27" ry="32"/></clipPath><clipPath id="clipEyeR"><ellipse cx="302" cy="150" rx="27" ry="32"/></clipPath></defs><style>#duck { animation: bob 4.2s ease-in-out infinite; }
    #shadow { transform-box: view-box; transform-origin: 256px 480px;
              animation: shadowPulse 4.2s ease-in-out infinite; }
    #head { transform-box: view-box; transform-origin: 256px 288px;
            animation: tilt 6.4s ease-in-out infinite; }
    #hair path { transform-box: view-box; transform-origin: 254px 62px;
                 animation: sway 3.4s ease-in-out infinite; }
    #hair path:nth-child(2) { animation-delay: .35s; }
    #hair path:nth-child(3) { animation-delay: .7s; }
    .lid { transform-box: fill-box; transform-origin: 50% 0%;
           transform: scaleY(0); animation: blink 5.6s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes shadowPulse { 0%,100% { transform: scale(1); opacity:.12 } 50% { transform: scale(1.06); opacity:.16 } }
    @keyframes tilt { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-1.3deg); } 75% { transform: rotate(1.1deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 90.5%, 94.5%, 100% { transform: scaleY(0); } 91.5%, 93.5% { transform: scaleY(1); } }
    /* clases opcionales: añadir en el elemento raíz del SVG */
    svg.talk #bill-lower, .talk #bill-lower { animation: talk .42s ease-in-out infinite; }
    #bill-lower { transform-box: view-box; transform-origin: 256px 248px; }
    @keyframes talk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .wave #arm-up { animation: wave 1.1s ease-in-out infinite; }
    #arm-up { transform-box: view-box; transform-origin: 330px 320px; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><ellipse id="shadow" cx="256" cy="480" fill="#1b2430" opacity=".12" rx="130" ry="15"/><g id="duck"><g id="feet"><path fill="url(#gFoot)" d="M172 474c-4-28 14-44 38-44s40 16 36 44c-7-8-15-8-21 0-6-8-16-8-22 0-7-8-19-8-31 0"/><path fill="url(#gFoot)" d="M266 474c-4-28 12-44 36-44s42 16 38 44c-12-8-24-8-31 0-6-8-16-8-22 0-6-8-14-8-21 0"/></g><g id="wing-left"><path fill="url(#gCoat)" d="M190 292c-38 8-62 44-58 80 2 20 20 26 36 16 24-16 36-52 36-84Z"/><ellipse cx="152" cy="376" fill="#f7c844" rx="13" ry="11" transform="rotate(24 152 376)"/></g><g id="wing-right"><path fill="url(#gCoat)" d="M322 292c38 8 62 44 58 80-2 20-20 26-36 16-24-16-36-52-36-84Z"/><ellipse cx="360" cy="376" fill="#f7c844" rx="13" ry="11" transform="rotate(-24 360 376)"/></g><g id="body"><path fill="url(#gBody)" d="M256 256c-58 2-88 50-92 102-4 48 36 84 92 84s96-36 92-84c-4-52-34-100-92-102"/><ellipse cx="256" cy="378" fill="#ffe9a8" rx="62" ry="48"/><path fill="#de9a1e" d="M176 388c12 38 44 52 80 52s68-14 80-52c-8 42-40 58-80 58s-72-16-80-58" opacity=".35"/></g><g id="coat"><path fill="url(#gCoat)" d="M256 262c-60 2-94 48-98 98-4 52 40 86 98 86s102-34 98-86c-4-50-38-96-98-98"/><path fill="url(#gBody)" d="M234 266h44c10 54 12 114 8 176h-60c-4-62-2-122 8-176"/><ellipse cx="256" cy="394" fill="#ffe9a8" rx="34" ry="46"/><path fill="#fff" stroke="#d9e2eb" stroke-width="2.5" d="m236 266-22 36 30 20 6-42Zm40 0 22 36-30 20-6-42Z"/><path fill="#c9d4e0" d="M168 380c8 36 36 58 64 62-32 0-60-18-70-50Zm176 0c-8 36-36 58-64 62 32 0 60-18 70-50Z" opacity=".7"/></g><g id="estetoscopio" fill="none" stroke="#37474f" stroke-linecap="round" stroke-width="7"><path d="M206 296c4 34 22 56 46 66m54-66c-4 34-22 56-46 66m-4 0c12 6 24 16 28 28"/><circle cx="286" cy="398" r="13" fill="#90a4ae" stroke="#546e7a" stroke-width="3"/><circle cx="286" cy="398" r="5.5" fill="#cfd8dc" stroke="none"/></g><g id="badge"><rect width="30" height="38" x