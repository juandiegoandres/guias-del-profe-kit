<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" aria-labelledby="t d" viewBox="0 0 512 512"><title id="t">Dr. Cuack — científico</title><desc id="d">Dr. Cuack con bata de laboratorio, gafas de seguridad y matraz burbujeante.</desc><defs><linearGradient id="gBeak" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#ffbe55"/><stop offset="100%" stop-color="#ee8e1e"/></linearGradient><linearGradient id="gFoot" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f5ac42"/><stop offset="100%" stop-color="#de8b26"/></linearGradient><linearGradient id="gCoat" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e8eef5"/></linearGradient><radialGradient id="gBody" cx="226" cy="316" r="170" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe07a"/><stop offset="55%" stop-color="#ffcf3f"/><stop offset="100%" stop-color="#f0ae2b"/></radialGradient><radialGradient id="gHead" cx="230" cy="120" r="210" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffe38a"/><stop offset="55%" stop-color="#ffd147"/><stop offset="100%" stop-color="#f2b02c"/></radialGradient><clipPath id="clipEyeL"><ellipse cx="210" cy="150" rx="27" ry="32"/></clipPath><clipPath id="clipEyeR"><ellipse cx="302" cy="150" rx="27" ry="32"/></clipPath></defs><style>#duck { animation: bob 4.2s ease-in-out infinite; }
    #shadow { transform-box: view-box; transform-origin: 256px 480px;
              animation: shadowPulse 4.2s ease-in-out infinite; }
    #head { transform-box: view-box; transform-origin: 256px 288px;
            animation: tilt 6.4s ease-in-out infinite; }
    #hair path { transform-box: view-box; transform-origin: 254px 62px;
                 animation: sway 3.4s ease-in-out infinite; }
    #hair path:nth-child(2) { animation-delay: .35s; }
    #hair path:nth-child(3) { animation-delay: .7s; }
    .lid { transform-box: fill-box; transform-origin: 50% 0%;
           transform: scaleY(0); animation: blink 5.6s infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    @keyframes shadowPulse { 0%,100% { transform: scale(1); opacity:.12 } 50% { transform: scale(1.06); opacity:.16 } }
    @keyframes tilt { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-1.3deg); } 75% { transform: rotate(1.1deg); } }
    @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 90.5%, 94.5%, 100% { transform: scaleY(0); } 91.5%, 93.5% { transform: scaleY(1); } }
    /* clases opcionales: añadir en el elemento raíz del SVG */
    svg.talk #bill-lower, .talk #bill-lower { animation: talk .42s ease-in-out infinite; }
    #bill-lower { transform-box: view-box; transform-origin: 256px 248px; }
    @keyframes talk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .wave #arm-up { animation: wave 1.1s ease-in-out infinite; }
    #arm-up { transform-box: view-box; transform-origin: 330px 320px; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    .bubble { animation: rise 2.6s ease-in infinite; }
    .bubble.b2 { animation-delay: .9s; }
    .bubble.b3 { animation-delay: 1.7s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; }
      25% { opacity: .95; } 100% { transform: translateY(-40px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><ellipse id="shadow" cx="256" cy="480" fill="#1b2430" opacity=".12" rx="130" ry="15"/><g id="duck"><g id="feet"><path fill="url(#gFoot)" d="M172 474c-4-28 14-44 38-44s40 16 36 44c-7-8-15-8-21 0-6-8-16-8-22 0-7-8-19-8-31 0"/><path fill="url(#gFoot)" d="M266 474c-4-28 12-44 36-44s42 16 38 44c-12-8-24-8-31 0-6-8-16-8-22 0-6-8-14-8-21 0"/></g><g id="wing-left"><path fill="url(#gCoat)" d="M190 292c-38 8-62 44-58 80 2 20 20 26 36 16 24-16 36-52 36-84Z"/><ellipse cx="152" cy="376" fill="#f7c844" rx="13" ry="11" transform="rotate(24 152 376)"/></g><g id="body"><path fill="url(#gBody)" d="M256 256c-58 2-88 50-92 102-4 48 36 84 92 84s96-36 92-84c-4-52-34-100-92-102"/><ellipse cx="256" cy="378" fill="#ffe9a8" rx="62" ry="48"/><path fill="#de9a1e" d="M176 388c12 38 44 52 80 52s68-14 80-52c-8 42-40 58-80 58s-72-16-80-58" opacity=".35"/></g><g id="coat"><path fill="url(#gCoat)" d="M256 262c-60 2-94 48-98 98-4 52 40 86 98 86s102-34 98-86c-4-50-38-96-98-98"/><path fill="url(#gBody)" d="M234 266h44c10 54 12 114 8 176h-60c-4-62-2-122 8-176"/><ellipse cx="256" cy="394" fill="#ffe9a8" rx="34" ry="46"/><path fill="#fff" stroke="#d9e2eb" stroke-width="2.5" d="m236 266-22 36 30 20 6-42Zm40 0 22 36-30 20-6-42Z"/><path fill="#c9d4e0" d="M168 380c8 36 36 58 64 62-32 0-60-18-70-50Zm176 0c-8 36-36 58-64 62 32 0 60-18 70-50Z" opacity=".7"/></g><g id="pocket"><rect width="36" height="28" x="192" y="356" fill="#fff" stroke="#d9e2eb" stroke-width="2.5" rx="4"/><rect width="7" height="18" x="199" y="342" fill="#1e4078" rx="2.5"/><rect width="7" height="16" x="210" y="344" fill="#a54b2d" rx="2.5"/></g><g id="head"><path fill="url(#gHead)" d="M256 56c-72 0-106 58-106 128 0 66 44 110 106 110s106-44 106-110c0-70-34-128-106-128"/><ellipse cx="212" cy="108" fill="#fff" opacity=".16" rx="48" ry="34"/><path id="hair" fill="none" stroke="#2f2a26" stroke-linecap="round" stroke-width="5" d="M252 58c-4-22 0-38 16-48m-30 52c-8-18-8-34 6-46m24 44c4-20 16-34 34-38"/><ellipse cx="172" cy="176" fill="#ffac55" opacity=".5" rx="13" ry="9"/><ellipse cx="340" cy="176" fill="#ffac55" opacity=".5" rx="13" ry="9"/><g id="eye-left"><ellipse cx="210" cy="150" fill="#fff" rx="27" ry="32"/><path fill="none" stroke="#d8d2c4" stroke-width="3" d="M183 150a27 32 0 0 1 54 0" opacity=".6"/><circle cx="215" cy="153" r="12.5" fill="#33261b"/><circle cx="211" cy="148" r="4" fill="#fff"/><circle cx="219" cy="158" r="2" fill="#fff" opacity=".8"/><g clip-path="url(#clipEyeL)"><ellipse cx="210" cy="150" fill="#f6c74a" class="lid" rx="28" ry="33"/></g></g><g id="eye-right"><ellipse cx="302" cy="150" fill="#fff" rx="27" ry="32"/><path fill="none" stroke="#d8d2c4" stroke-width="3" d="M275 150a27 32 0 0 1 54 0" opacity=".6"/><circle cx="297" cy="153" r="12.5" fill="#33261b"/><circle cx="293" cy="148" r="4" fill="#fff"/><circle cx="301" cy="158" r="2" fill="#fff" opacity=".8"/><g clip-path="url(#clipEyeR)"><ellipse cx="302" cy="150" fill="#f6c74a" class="lid" rx="28" ry="33"/></g></g><path fill="none" stroke="#8a6414" stroke-linecap="round" stroke-width="6" d="M186 108c10-8 28-10 42-4m56 0c14-6 32-4 42 4"/><g id="beak" transform="translate(0 7)"><path id="bill-lower" fill="#dd831a" d="M156 244c36 14 164 14 200 0-4 18-26 31-56 36-28 4-60 4-88 0-30-5-52-18-56-36"/><path fill="#c06e0c" d="M172 264c24 12 144 12 168 0-18 13-52 19-84 19s-66-6-84-19" opacity=".8"/><path fill="url(#gBeak)" d="M124 210c4-18 52-26 132-26s128 8 132 26c3 14-8 28-32 36-34 9-166 9-200 0-24-8-35-22-32-36"/><g fill="none" stroke="#a96409" stroke-linecap="round" stroke-width="4"><path d="M140 220c10 14 36 23 72 27 29 3 59 3 88 0 36-4 62-13 72-27"/><path d="M141 221q-9-5-7-15m237 15q9-5 7-15"/></g><g id="nostrils"><ellipse cx="233" cy="204" fill="#9e5605" rx="6.5" ry="3.6" transform="rotate(-16 233 204)"/><ellipse cx="279" cy="204" fill="#9e5605" rx="6.5" ry="3.6" transform="rotate(16 279 204)"/><path fill="none" stroke="#ffd98f" stroke-width="2" d="M227 208q6 3 13-1m32 0q7 4 13 1" opacity=".7"/></g><path fill="none" stroke="#ffe1a6" stroke-linecap="round" stroke-width="7" d="M152 203c18-9 56-14 98-15" opacity=".6"/></g><g id="glasses" fill="none" stroke="#23303e" stroke-width="5"><circle cx="210" cy="150" r="34" fill="#aad7ff" fill-opacity=".14"/><circle cx="302" cy="150" r="34" fill="#aad7ff" fill-opacity=".14"/><path d="M244 146c6-6 18-6 24 0m-92 0-20 6m180-6 20 6"/><path stroke="#fff" stroke-width="3" d="M190 132a26 26 0 0 1 16-10m76 10a26 26 0 0 1 16-10" opacity=".65"/></g><g id="goggles"><path fill="none" stroke="#37474f" stroke-width="9" d="M158 104c40-24 156-24 196 0"/><rect width="120" height="42" x="196" y="66" fill="#aee3f7" fill-opacity=".85" stroke="#37474f" stroke-width="6" rx="21"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" d="M214 80c16-6 36-8 54-6" opacity=".8"/></g></g><g id="arm-up"><path fill="url(#gCoat)" d="M330 322c32-8 60-30 68-60 4-16-8-25-22-18-24 12-44 40-52 72Z"/><ellipse cx="390" cy="256" fill="#f7c844" rx="13" ry="11" transform="rotate(-32 390 256)"/><g id="flask" transform="rotate(-8 602.21 299.804)"><path fill="#d2ebfa" fill-opacity=".55" stroke="#7fa8c9" stroke-linejoin="round" stroke-width="3.5" d="M399 152v28l-19 34q-5 9 5 9h46q10 0 5-9l-19-34v-28Z"/><path fill="#17a673" fill-opacity=".9" d="m389 198-9 16q-5 9 5 9h46q10 0 5-9l-9-16Z"/><rect width="28" height="8" x="394" y="146" fill="#7fa8c9" rx="4"/><circle cx="401" cy="212" r="3.4" fill="#bff3de" class="bubble"/><circle cx="412" cy="216" r="2.6" fill="#bff3de" class="bubble b2"/><circle cx="422" cy="211" r="3" fill="#bff3de" class="bubble b3"/></g></g></g></svg>